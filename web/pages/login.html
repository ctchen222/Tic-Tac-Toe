<!-- Login Page -->
<h2>登入</h2>
<form id="loginForm" class="auth-form">
    <div class="form-group">
        <label for="login-username">使用者名稱</label>
        <input type="text" id="login-username" name="username" required>
    </div>
    <div class="form-group">
        <label for="login-password">密碼</label>
        <input type="password" id="login-password" name="password" required>
    </div>
    <p id="login-error" class="error-message" style="display:none;"></p>
    <button type="submit" class="submit-btn">登入</button>
    <button type="button" id="guestLoginBtn" class="submit-btn" style="background-color:#00ffff; margin-top: 15px;">訪客登入</button>
</form>
<p class="switch-auth">還沒有帳號？ <a href="#" id="switchToRegister">點此註冊</a></p>
