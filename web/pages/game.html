<!-- Game Page -->
<div id="mainStatus">
    <p id="statusText" class="status-message">正在驗證身份...</p>
</div>

<div id="lobbyArea" style="display:none;">
    <p>請選擇遊戲模式：</p>
    <div class="button-group">
        <button id="playBotBtn">機器人對戰</button>
        <select id="difficultySelect">
            <option value="easy">簡單</option>
            <option value="medium" selected>中等</option>
            <option value="hard">困難</option>
        </select>
        <button id="playHumanBtn">連線對戰</button>
    </div>
</div>

<div id="gameArea" style="display:none;">
    <p id="currentTurnDisplay"></p>
    <p id="gameMessage"></p>
    <div id="gameBoard">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    			<div id="rematchButtons" style="display:none;">
    				<button id="rematchYesBtn">同意重賽</button>
    				<button id="rematchNoBtn">拒絕重賽</button>
    				<button id="leaveLobbyBtn">回到大廳</button>
    			</div></div>
