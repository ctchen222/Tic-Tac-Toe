<!-- Register Page -->
<h2>註冊</h2>
<form id="registerForm" class="auth-form">
    <div class="form-group">
        <label for="register-username">使用者名稱</label>
        <input type="text" id="register-username" name="username" required>
    </div>
    <div class="form-group">
        <label for="register-password">密碼</label>
        <input type="password" id="register-password" name="password" required>
    </div>
    <div class="form-group">
        <label for="register-confirm-password">確認密碼</label>
        <input type="password" id="register-confirm-password" name="confirm_password" required>
    </div>
    <p id="register-error" class="error-message" style="display:none;"></p>
    <button type="submit" class="submit-btn">註冊</button>
</form>
<p class="switch-auth">已經有帳號？ <a href="#" id="switchToLogin">點此登入</a></p>
